<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Iron Log</title>
<meta name="description" content="Full-body 3x/week training log with rest timer, exercise photos, weekly schedule and progress charts.">
<meta name="theme-color" content="#08090C">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <b><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Iron Log</b>
      <span id="crumb">Full body · 3×/week</span>
    </div>
    <div class="tools">
      <button class="tool" id="wakeBtn" aria-pressed="false" hidden title="Keep the screen on">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
        Awake
      </button>
      <button class="tool cloud" id="cloudBtn" data-s="local" hidden><i></i><span id="cloudTxt">Local</span></button>
    </div>
  </div>
  <div class="wrap" id="subbar"></div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-view="train" aria-current="page">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>
    Train
  </button>
  <button data-view="week" aria-current="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Week
  </button>
  <button data-view="progress" aria-current="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>
    Progress
  </button>
  <button data-view="me" aria-current="false">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    You
  </button>
</nav>

<div class="dock" id="dock" data-phase="run" aria-live="polite">
  <div class="dock-in">
    <div class="dock-top">
      <div class="dock-ex" id="dkEx">Rest</div>
      <div class="dock-set" id="dkSet"></div>
    </div>
    <div class="clock" id="dkClock">0:00</div>
    <div class="track"><div class="fill" id="dkFill"></div></div>
    <div class="dock-acts">
      <button class="act" data-t="-15">&minus;15s</button>
      <button class="act" data-t="30">+30s</button>
      <button class="act primary" data-t="skip">Skip rest</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
